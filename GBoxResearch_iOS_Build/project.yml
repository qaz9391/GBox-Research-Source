name: GBoxResearchApp

options:
  bundleIdPrefix: com.gboxresearch

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 15.0

targets:
  GBoxResearchApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: GBoxResearchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gboxresearch.app
        INFOPLIST_KEY_CFBundleDisplayName: GBox Research
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: GBox Research 需要區域網路連線至個人測試電腦。

